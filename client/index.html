<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PhoneSaber</title>
    <style>
      html, body, #root { margin: 0; width: 100%; height: 100%; background: #05070a; overflow: hidden; }
      canvas { display: block; }
      #root { position: fixed; inset: 0; }
      #debug-scene { position: fixed; inset: 0; background: #000; }
      #hud {
        position: fixed; top: 8px; left: 8px;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        color: #6f6; background: rgba(0,0,0,0.4); padding: 6px 8px;
        border-radius: 4px; pointer-events: none; white-space: pre;
        z-index: 10;
      }
      #mode-toggle {
        position: fixed; top: 8px; right: 8px;
        z-index: 11;
        height: 32px;
        border: 1px solid rgba(174, 204, 255, 0.35);
        border-radius: 6px;
        background: rgba(9, 13, 18, 0.7);
        color: #d9e8ff;
        font: 12px/1 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
        padding: 0 12px;
        cursor: pointer;
        backdrop-filter: blur(12px);
      }
      /* Webcam preview, mirrored, in the bottom-right corner. */
      #cam {
        position: fixed; bottom: 8px; right: 8px;
        width: 240px; height: 180px;
        object-fit: cover;
        transform: scaleX(-1);
        border: 1px solid #333; border-radius: 4px;
        opacity: 0.7;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="hud">connecting…</div>
    <video id="cam" autoplay muted playsinline></video>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
